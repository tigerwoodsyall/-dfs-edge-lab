name: Publish official NBA injuries

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

# This workflow cannot push commits or edit repository source files.
permissions:
  contents: read

concurrency:
  # Separate this publisher from the legacy Pages queue, which can retain stale runs.
  group: nba-pages-publisher-v2
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install report parser
        run: python -m pip install pdfplumber==0.11.9
      - name: Read latest official NBA injury report
        id: injuries
        continue-on-error: ${{ github.event_name == 'push' }}
        run: python update-nba-injuries.py
      - name: Preserve the published injury feed on a code deployment
        if: steps.injuries.outcome == 'failure' && github.event_name == 'push'
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://tigerwoodsyall.github.io/-dfs-edge-lab/nba-injuries.json \
            --output /tmp/previous-nba-injuries.json
          python -c 'import json; d=json.load(open("/tmp/previous-nba-injuries.json")); assert d["version"] == 1 and isinstance(d["players"], list) and d["reportAt"]'
          cp /tmp/previous-nba-injuries.json nba-injuries.json
          echo "::warning::Official injury refresh failed. Published injury timestamps are preserved."
      - name: Refresh automatically reported starting lineups
        timeout-minutes: 2
        continue-on-error: true
        run: python update-starting-lineups.py
      - name: Refresh daily model inputs
        timeout-minutes: 10
        continue-on-error: true
        run: python update-model-data.py
      - name: Refresh daily all-team roster inputs
        timeout-minutes: 2
        continue-on-error: true
        run: python update-rotation-data.py
      - name: Package public website and refreshed injury feed
        run: |
          mkdir -p _site
          cp index.html ./*.js ./*.json _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site and injury feed
        id: deployment
        uses: actions/deploy-pages@v4

